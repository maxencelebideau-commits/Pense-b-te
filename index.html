<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pense-bête</title>
<meta name="theme-color" content="#0E131C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pense-bête">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one-column phone app — big view title, sticky view chips, grouped task cards, thumb-reach add button, top-anchored sheets that stay clear of the keyboard */
:root{
  color-scheme: dark;
  --bg:#0E131C;          /* encre de nuit */
  --surface:#161D29;
  --surface-2:#1F2836;
  --line:#2B3546;
  --fg:#EEE9DD;          /* papier */
  --muted:#8F9AAC;
  --faint:#5D6879;
  --accent:#f304e3;      /* surligneur */
  --accent-ink:#231A03;
  --accent-soft:rgba(255,209,92,.14);
  --hl:rgba(255,209,92,.30);
  --high:#FF7A6B;
  --high-ink:#2B0A05;
  --mid:#5647ff;
  --low:#6FB6FF;
  --shade:rgba(3,6,10,.62);
  --font-display:"Bricolage Grotesque", ui-rounded, -apple-system, system-ui, sans-serif;
  --font-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r:16px;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
*, *::before, *::after{box-sizing:border-box;}
html{padding-top:env(safe-area-inset-top, 0px);-webkit-text-size-adjust:100%;}
body{margin:0;overscroll-behavior-y:none;}
[hidden]{display:none !important;}
button{touch-action:manipulation;}
.backup{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 18px;padding:6px 4px 0;font-size:13.5px;color:var(--faint);text-align:center;}
.backup p{margin:0;width:100%;}
.backup button{color:var(--muted);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px 2px;}
html, body{background:var(--bg);color:var(--fg);}
html.locked, html.locked body{overflow:hidden;}
body{font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg);}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;}
input, textarea{font:inherit;color:var(--fg);}
button:focus-visible, input:focus-visible, textarea:focus-visible, [role="button"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ---------- page ---------- */
.app{padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:0 150px;max-width:640px;margin:0 auto;}
.head{padding-block:22px 4px;display:flex;flex-direction:column;gap:4px;}
.eyebrow{margin:0;font-size:14px;color:var(--muted);letter-spacing:.01em;}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:38px;line-height:1.05;letter-spacing:-.025em;text-wrap:balance;min-width:0;overflow-wrap:anywhere;}
.hl{background:linear-gradient(176deg, transparent 56%, var(--hl) 56%, var(--hl) 90%, transparent 90%);padding:0 .06em;-webkit-box-decoration-break:clone;box-decoration-break:clone;}
.summary{margin:2px 0 0;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;}
.summary .late{color:var(--high);}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg);}
.icon-btn svg{width:20px;height:20px;}

/* ---------- chips ---------- */
.chips{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:550;white-space:nowrap;}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.chip .count{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;}
.chip[aria-pressed="true"] .count{color:var(--accent-ink);opacity:.65;}
.chip-add{border-style:dashed;color:var(--muted);background:transparent;}
.dot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;background:var(--c, var(--muted));}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 1.5px var(--accent-ink);}

/* ---------- banners ---------- */
#banners{display:flex;flex-direction:column;gap:8px;}
#banners:not(:empty){margin-top:4px;}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px dashed var(--line);font-size:14px;color:var(--muted);}
.banner p{margin:0;min-width:0;}
.banner button{flex:none;color:var(--accent);font-weight:650;font-size:14px;padding:6px 2px;}

/* ---------- groups & tasks ---------- */
#list{display:flex;flex-direction:column;gap:22px;margin-top:10px;}
.group{display:flex;flex-direction:column;gap:8px;}
.group-h{margin:0;display:flex;align-items:baseline;gap:8px;padding:0 4px;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.group-h .n{font-variant-numeric:tabular-nums;color:var(--faint);}
.group-h.overdue{color:var(--high);}
.group-h.overdue .n{color:var(--high);opacity:.6;}

.task-wrap{position:relative;border-radius:var(--r);overflow:hidden;}
.del-action{position:absolute;top:0;bottom:0;right:0;width:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;background:var(--high);color:var(--high-ink);font-weight:700;font-size:15px;visibility:hidden;border-radius:var(--r);}
.task-wrap.swiping .del-action{visibility:visible;}
.task{position:relative;display:flex;align-items:flex-start;gap:13px;padding:14px 16px 14px 14px;min-height:58px;background:var(--surface);border-radius:var(--r);touch-action:pan-y;transition:transform .22s cubic-bezier(.2,.8,.2,1);cursor:pointer;}
.task.dragging{transition:none;}
.p1{--pc:var(--low);} .p2{--pc:var(--mid);} .p3{--pc:var(--high);}
.check{position:relative;flex:none;width:26px;height:26px;margin-top:-1px;border-radius:50%;border:2px solid var(--pc, var(--faint));display:grid;place-items:center;color:var(--bg);transition:background .18s, border-color .18s;}
.check::before{content:"";position:absolute;inset:-10px;}
.check svg{width:15px;height:15px;opacity:0;transform:scale(.6);transition:opacity .18s, transform .18s;}
.task.is-done .check, .task.completing .check{background:var(--pc, var(--muted));border-color:var(--pc, var(--muted));}
.task.is-done .check svg, .task.completing .check svg{opacity:1;transform:none;}
.task-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.task-line{font-size:16.5px;line-height:1.35;overflow-wrap:anywhere;}
.prio-inline{font-weight:800;color:var(--pc);margin-right:6px;letter-spacing:.02em;}
.task-title{background-image:linear-gradient(currentColor, currentColor);background-repeat:no-repeat;background-position:0 58%;background-size:0% 1.5px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .38s ease, color .2s;}
.task.is-done .task-title, .task.completing .task-title{background-size:100% 1.5px;color:var(--muted);}
.task.is-done .prio-inline{opacity:.5;}
.task-note{margin:0;font-size:14px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.task-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:13.5px;color:var(--muted);}
.meta-due, .meta-list{display:inline-flex;align-items:center;gap:5px;}
.meta-due svg{width:13px;height:13px;}
.meta-due.today{color:var(--accent);}
.meta-due.overdue{color:var(--high);}
.tag-ex{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;padding:1px 6px;border:1px solid var(--line);border-radius:6px;color:var(--faint);}

.done-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px;}
.done-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 0;}
.done-toggle svg{width:14px;height:14px;transition:transform .2s;}
.done-toggle[aria-expanded="true"] svg{transform:rotate(90deg);}
.link-btn{color:var(--accent);font-size:14px;font-weight:650;padding:6px 2px;}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:40px 12px 8px;color:var(--muted);}
.empty svg{width:120px;height:90px;margin-bottom:8px;}
.empty strong{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-.01em;color:var(--fg);}
.empty p{margin:0;max-width:30ch;font-size:15px;}

.skel{height:58px;border-radius:var(--r);background:linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}

/* ---------- add bar ---------- */
.addbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;pointer-events:none;padding:28px var(--gutter-r) calc(14px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);background:linear-gradient(to top, var(--bg) 55%, transparent);}
.add-btn{pointer-events:auto;width:100%;max-width:440px;height:56px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 28px var(--shade);}
.add-btn svg{width:20px;height:20px;}
.add-btn:active{transform:scale(.98);}

/* ---------- sheets ---------- */
.backdrop{position:fixed;inset:0;z-index:20;background:var(--shade);opacity:0;transition:opacity .25s;}
.backdrop.open{opacity:1;}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top, 0px) + 24px);z-index:21;max-width:640px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);}
.sheet.open{transform:none;}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px var(--gutter-r) 12px var(--gutter-l);border-bottom:1px solid var(--line);}
.sheet-head h2{margin:0;font-size:17px;font-weight:650;text-align:center;}
.sheet-head .ghost{justify-self:start;color:var(--muted);font-size:16px;padding:8px 2px;}
.pill{justify-self:end;height:36px;padding:0 16px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:24px;padding:18px var(--gutter-r) calc(28px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);}
.field{display:flex;flex-direction:column;gap:10px;}
.field-label{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.title-input{width:100%;background:transparent;border:0;outline:none;font-size:22px;font-weight:600;padding:4px 0;caret-color:var(--accent);}
.title-input:focus-visible{outline:none;}
.title-input::placeholder, .note-input::placeholder, .text-input::placeholder{color:var(--faint);}
.note-input, .text-input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;resize:none;}
.text-input{font-size:17px;}
.opts{display:flex;flex-wrap:wrap;gap:8px;}
.opt{height:38px;padding:0 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:15px;display:inline-flex;align-items:center;gap:7px;}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.date-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 6px 6px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:15px;color:var(--muted);}
.date-row.has-value{border-color:var(--accent);color:var(--accent);}
.date-input{min-width:150px;min-height:38px;background:transparent;border:0;font-size:16px;color:var(--fg);color-scheme:dark;text-align:right;-webkit-appearance:none;appearance:none;}
.date-input::-webkit-date-and-time-value{text-align:right;}
.seg{display:grid;grid-template-columns:repeat(4, 1fr);gap:6px;}
.seg-btn{min-height:52px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13.5px;}
.seg-btn b{font-size:15px;font-weight:800;color:var(--pc, var(--faint));line-height:1.1;letter-spacing:.03em;}
.seg-btn[aria-pressed="true"]{border-color:var(--pc, var(--fg));background:var(--surface);box-shadow:inset 0 0 0 1px var(--pc, var(--fg));}
.danger-btn{width:100%;min-height:50px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--high);font-weight:650;font-size:16px;}
.danger-btn.confirm{background:var(--high);border-color:var(--high);color:var(--high-ink);}
.swatches{display:flex;flex-wrap:wrap;gap:14px;}
.swatch{width:38px;height:38px;border-radius:50%;background:var(--c);}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--c);}
.hint{margin:0;font-size:14px;color:var(--muted);}
.shake{animation:shake .32s;}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom, 0px));z-index:30;transform:translate(-50%, 12px);opacity:0;transition:opacity .2s, transform .2s;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:16px;padding:12px 14px 12px 18px;border-radius:14px;background:var(--fg);color:var(--bg);font-size:15px;font-weight:550;box-shadow:0 10px 30px var(--shade);}
.toast.show{opacity:1;transform:translate(-50%, 0);}
.toast button{flex:none;font-weight:800;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:6px 12px;font-size:14px;}

@media (min-width:700px){ h1{font-size:44px;} }
@media (prefers-reduced-motion: reduce){ *, *::before, *::after{transition:none !important;animation:none !important;} }
</style>
</head>
<body>

<div class="app">
  <header class="head">
    <p class="eyebrow" id="todayLabel"></p>
    <div class="head-row">
      <h1 id="viewTitle"><span class="hl">Aujourd'hui</span></h1>
      <button class="icon-btn" id="viewMenu" type="button" aria-label="Modifier cette liste" hidden>
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4.5" cy="10" r="1.7" style="fill:currentColor"/><circle cx="10" cy="10" r="1.7" style="fill:currentColor"/><circle cx="15.5" cy="10" r="1.7" style="fill:currentColor"/></svg>
      </button>
    </div>
    <p class="summary" id="summary">&nbsp;</p>
  </header>
  <nav class="chips" id="chips" aria-label="Vues et listes"></nav>
  <div id="banners"></div>
  <main id="list" aria-live="polite"></main>
</div>

<div class="addbar">
  <button class="add-btn" id="addBtn" type="button">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" style="fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round"/></svg>
    Nouvelle tâche
  </button>
</div>

<div class="backdrop" id="backdrop" hidden></div>

<form class="sheet" id="taskSheet" hidden autocomplete="off" novalidate>
  <div class="sheet-head">
    <button type="button" class="ghost" data-close>Annuler</button>
    <h2 id="tsTitle">Nouvelle tâche</h2>
    <button type="submit" class="pill" id="tsSubmit">Ajouter</button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label class="sr" for="fTitle">Titre de la tâche</label>
      <input id="fTitle" class="title-input" type="text" maxlength="200" placeholder="Que dois-tu faire ?" enterkeyhint="done">
      <label class="sr" for="fNote">Note</label>
      <textarea id="fNote" class="note-input" rows="2" maxlength="1000" placeholder="Ajouter une note (facultatif)"></textarea>
    </div>
    <div class="field">
      <p class="field-label">Échéance</p>
      <div class="opts" id="dueOpts"></div>
      <label class="date-row" id="dateRow"><span>Date précise</span><input type="date" id="fDue" class="date-input"></label>
    </div>
    <div class="field">
      <p class="field-label">Priorité</p>
      <div class="seg" id="prioOpts"></div>
    </div>
    <div class="field">
      <p class="field-label">Liste</p>
      <div class="opts" id="listOpts"></div>
    </div>
    <button type="button" class="danger-btn" id="tsDelete" hidden>Supprimer la tâche</button>
  </div>
</form>

<form class="sheet" id="listSheet" hidden autocomplete="off" novalidate>
  <div class="sheet-head">
    <button type="button" class="ghost" data-close>Annuler</button>
    <h2 id="lsTitle">Nouvelle liste</h2>
    <button type="submit" class="pill" id="lsSubmit">Créer</button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label class="field-label" for="lName">Nom</label>
      <input id="lName" class="text-input" type="text" maxlength="30" placeholder="Ex. Maison, Sport, Projets" enterkeyhint="done">
    </div>
    <div class="field">
      <p class="field-label">Couleur</p>
      <div class="swatches" id="swatches"></div>
    </div>
    <button type="button" class="danger-btn" id="lsDelete" hidden>Supprimer la liste</button>
  </div>
</form>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button type="button" id="toastAction" hidden></button></div>

<script>
(function () {
  'use strict';

  /* ---------- constants ---------- */
  var LIST_COLORS = ['#FFD15C', '#6FB6FF', '#7BD88F', '#FF8FB1', '#B79CFF', '#FF9F5A'];
  var DEFAULT_LISTS = [
    { id: 'perso', name: 'Perso', color: '#7BD88F' },
    { id: 'travail', name: 'Travail', color: '#6FB6FF' },
    { id: 'courses', name: 'Courses', color: '#FF9F5A' }
  ];
  var PRIO = [
    { v: 0, label: 'Aucune', marks: '', aria: '' },
    { v: 1, label: 'Basse', marks: '!', aria: 'Priorité basse' },
    { v: 2, label: 'Moyenne', marks: '!!', aria: 'Priorité moyenne' },
    { v: 3, label: 'Haute', marks: '!!!', aria: 'Priorité haute' }
  ];
  var KEYS = { local: 'pb.local.v1', view: 'pb.view', hint: 'pb.hint.dismissed' };
  var CHECK_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" style="fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round"/></svg>';
  var CAL_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2.5" style="fill:none;stroke:currentColor;stroke-width:1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3" style="fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round"/></svg>';
  var CHEVRON_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/></svg>';
  var EMPTY_SVG = '<svg viewBox="0 0 120 90" aria-hidden="true"><rect x="12" y="42" width="96" height="22" rx="4" transform="rotate(-4 60 53)" style="fill:var(--hl)"/><rect x="34" y="14" width="52" height="52" rx="15" style="fill:none;stroke:var(--fg);stroke-width:4"/><path d="M47 40l10 10 19-22" style="fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round"/></svg>';
  var isStandalone = window.navigator.standalone === true || !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var storageOK = (function () { try { localStorage.setItem('pb.test', '1'); localStorage.removeItem('pb.test'); return true; } catch (e) { return false; } })();
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function lsGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseISO(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function todayISO() { return iso(new Date()); }
  function dayDiff(a, b) { return Math.round((parseISO(a) - parseISO(b)) / 86400000); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function fmt(s, o) { return parseISO(s).toLocaleDateString('fr-FR', o); }
  function newId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function plural(n, one, many) { return n + ' ' + (n > 1 ? many : one); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* ---------- state ---------- */
  var S = {
    mode: 'pending',          // pending | db | local
    db: null,
    tasks: new Map(),
    lists: DEFAULT_LISTS.slice(),
    loaded: false,
    listsReady: false,
    view: 'today',
    doneOpen: false,
    today: todayISO(),
    pending: new Map(),
    pendingLists: false,
    localCount: 0
  };

  function cleanTask(id, v) {
    if (typeof id !== 'string' || !id || !v || typeof v !== 'object') return null;
    var due = (typeof v.due === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v.due)) ? v.due : null;
    return {
      id: id,
      title: String(v.title == null ? '' : v.title).slice(0, 500),
      note: String(v.note == null ? '' : v.note).slice(0, 2000),
      listId: typeof v.listId === 'string' ? v.listId : null,
      due: due,
      priority: [0, 1, 2, 3].indexOf(v.priority) >= 0 ? v.priority : 0,
      done: !!v.done,
      doneAt: typeof v.doneAt === 'number' ? v.doneAt : null,
      createdAt: typeof v.createdAt === 'number' ? v.createdAt : 0,
      example: !!v.example
    };
  }
  function cleanLists(arr) {
    if (!Array.isArray(arr)) return null;
    var out = [];
    arr.forEach(function (l) {
      if (l && typeof l.id === 'string' && l.id) {
        out.push({
          id: l.id,
          name: String(l.name == null ? '' : l.name).slice(0, 40) || 'Liste',
          color: /^#[0-9a-fA-F]{6}$/.test(l.color) ? l.color : LIST_COLORS[0]
        });
      }
    });
    return out;
  }
  function toBody(t) {
    return { title: t.title, note: t.note, listId: t.listId, due: t.due, priority: t.priority, done: t.done, doneAt: t.doneAt, createdAt: t.createdAt, example: t.example };
  }
  function allTasks() { return Array.from(S.tasks.values()); }
  function listById(id) { for (var i = 0; i < S.lists.length; i++) if (S.lists[i].id === id) return S.lists[i]; return null; }

  /* ---------- persistence ---------- */
  var chains = {};
  function enqueue(key, fn) {
    var p = (chains[key] || Promise.resolve()).then(fn, fn);
    chains[key] = p.catch(function () {});
    return p;
  }
  function persist(key, op) {
    return enqueue(key, function () {
      return op().catch(function (e) {
        if (e && e.code === 'unavailable') return sleep(400 + Math.random() * 600).then(op);
        throw e;
      });
    }).catch(onWriteError);
  }
  function onWriteError(e) {
    var code = e && e.code;
    var msg = "Enregistrement impossible. Vérifie ta connexion.";
    if (code === 'quota_exceeded') msg = 'Stockage plein : efface des tâches terminées.';
    else if (code === 'invalid_argument' || code === 'not_granted') msg = 'Seul le propriétaire peut modifier cette liste.';
    else if (code === 'resource_exhausted') msg = 'Trop de modifications d’un coup. Réessaie dans un instant.';
    toast(msg);
  }
  function tasksRef() { return S.db.collection('tasks'); }

  function writeTask(t) {
    S.tasks.set(t.id, t);
    if (S.mode === 'db') persist(t.id, function () { return tasksRef().doc(t.id).set(toBody(t)); });
    else if (S.mode === 'pending') S.pending.set(t.id, t);
  }
  function dropTask(id) {
    S.tasks.delete(id);
    if (S.mode === 'db') persist(id, function () { return tasksRef().doc(id).delete(); });
    else if (S.mode === 'pending') S.pending.set(id, null);
  }
  function saveLists() {
    if (S.mode === 'db') {
      var body = { lists: S.lists.map(function (l) { return { id: l.id, name: l.name, color: l.color }; }) };
      persist('__settings', function () { return S.db.doc('todo/settings').set(body); });
    } else if (S.mode === 'pending') S.pendingLists = true;
  }
  var cacheTimer = null;
  function scheduleCache() {
    clearTimeout(cacheTimer);
    cacheTimer = setTimeout(function () { lsSet(KEYS.cache, { tasks: allTasks(), lists: S.lists }); }, 400);
  }
  function saveLocal() { lsSet(KEYS.local, { tasks: allTasks(), lists: S.lists }); }
  function changed() {
    if (S.mode === 'local') saveLocal();
    else if (S.mode === 'db') scheduleCache();
    render();
  }

  /* ---------- views ---------- */
  function viewName(v) {
    if (v === 'today') return "Aujourd'hui";
    if (v === 'upcoming') return 'À venir';
    if (v === 'all') return 'Tout';
    var l = listById(v.slice(5));
    return l ? l.name : 'Liste';
  }
  function inView(t, v) {
    if (v === 'today') return !!t.due && t.due <= S.today;
    if (v === 'upcoming') return !!t.due && t.due > S.today;
    if (v === 'all') return true;
    if (v.indexOf('list:') === 0) return t.listId === v.slice(5);
    return true;
  }
  function openIn(v) { return allTasks().filter(function (t) { return !t.done && inView(t, v); }); }
  function doneIn(v) {
    return allTasks().filter(function (t) {
      if (!t.done) return false;
      if (v === 'today') return t.due === S.today || (!!t.doneAt && iso(new Date(t.doneAt)) === S.today);
      return inView(t, v);
    }).sort(function (a, b) { return (b.doneAt || 0) - (a.doneAt || 0); });
  }
  function byPrio(a, b) { return (b.priority - a.priority) || cmpDue(a, b) || (a.createdAt - b.createdAt); }
  function byDue(a, b) { return cmpDue(a, b) || (b.priority - a.priority) || (a.createdAt - b.createdAt); }
  function cmpDue(a, b) { var x = a.due || '9999-99-99', y = b.due || '9999-99-99'; return x < y ? -1 : x > y ? 1 : 0; }

  function groupsFor(v, open) {
    if (v === 'upcoming') {
      var byDay = {};
      open.forEach(function (t) { (byDay[t.due] = byDay[t.due] || []).push(t); });
      return Object.keys(byDay).sort().map(function (d) { return { label: dayHeader(d), items: byDay[d].sort(byPrio) }; });
    }
    var t1 = iso(addDays(parseISO(S.today), 1));
    var g = { overdue: [], today: [], tomorrow: [], later: [], none: [] };
    open.forEach(function (t) {
      if (!t.due) g.none.push(t);
      else if (t.due < S.today) g.overdue.push(t);
      else if (t.due === S.today) g.today.push(t);
      else if (t.due === t1) g.tomorrow.push(t);
      else g.later.push(t);
    });
    return [
      { label: 'En retard', items: g.overdue.sort(byDue), tone: 'overdue' },
      { label: "Aujourd'hui", items: g.today.sort(byPrio) },
      { label: 'Demain', items: g.tomorrow.sort(byPrio) },
      { label: 'Plus tard', items: g.later.sort(byDue) },
      { label: 'Sans date', items: g.none.sort(byPrio) }
    ].filter(function (x) { return x.items.length; });
  }
  function dueLabel(due) {
    var n = dayDiff(due, S.today);
    if (n === 0) return "Aujourd'hui";
    if (n === 1) return 'Demain';
    if (n === -1) return 'Hier';
    if (n > 1 && n < 7) return cap(fmt(due, { weekday: 'long' }));
    var o = { day: 'numeric', month: 'short' };
    if (due.slice(0, 4) !== S.today.slice(0, 4)) o.year = 'numeric';
    return fmt(due, o);
  }
  function dayHeader(due) {
    if (dayDiff(due, S.today) === 1) return 'Demain';
    var o = { weekday: 'long', day: 'numeric', month: 'long' };
    if (due.slice(0, 4) !== S.today.slice(0, 4)) o.year = 'numeric';
    return cap(fmt(due, o));
  }
  function quickDates() {
    var now = parseISO(S.today), wd = now.getDay();
    var toSat = wd === 0 ? 0 : 6 - wd;
    var toMon = ((8 - wd) % 7) || 7;
    return [
      { label: 'Aucune', value: null },
      { label: "Aujourd'hui", value: S.today },
      { label: 'Demain', value: iso(addDays(now, 1)) },
      { label: 'Ce week-end', value: iso(addDays(now, toSat)) },
      { label: 'Lundi prochain', value: iso(addDays(now, toMon)) }
    ];
  }

  /* ---------- render ---------- */
  function render() {
    if (!/^(today|upcoming|all)$/.test(S.view) && S.view.indexOf('list:') !== 0) S.view = 'today';
    if (S.view.indexOf('list:') === 0 && S.listsReady && !listById(S.view.slice(5))) S.view = 'all';
    renderHeader();
    renderChips();
    renderBanners();
    renderList();
  }

  function renderHeader() {
    $('todayLabel').textContent = cap(new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }));
    var h = $('viewTitle');
    h.textContent = '';
    h.appendChild(el('span', 'hl', viewName(S.view)));
    $('viewMenu').hidden = S.view.indexOf('list:') !== 0;
    var sum = $('summary');
    sum.textContent = '';
    if (!S.loaded) { sum.textContent = 'Chargement…'; return; }
    var open = openIn(S.view);
    var late = open.filter(function (t) { return t.due && t.due < S.today; }).length;
    if (!open.length) { sum.textContent = 'Rien à faire ici'; return; }
    sum.appendChild(document.createTextNode(plural(open.length, 'tâche à faire', 'tâches à faire')));
    if (late) {
      sum.appendChild(document.createTextNode(' · '));
      sum.appendChild(el('span', 'late', late + ' en retard'));
    }
  }

  function renderChips() {
    var nav = $('chips'), sl = nav.scrollLeft;
    nav.textContent = '';
    var items = [
      { key: 'today', label: "Aujourd'hui" },
      { key: 'upcoming', label: 'À venir' },
      { key: 'all', label: 'Tout' }
    ].concat(S.lists.map(function (l) { return { key: 'list:' + l.id, label: l.name, color: l.color }; }));
    items.forEach(function (it) {
      var b = el('button', 'chip');
      b.type = 'button';
      b.dataset.view = it.key;
      b.setAttribute('aria-pressed', String(S.view === it.key));
      if (it.color) { var d = el('i', 'dot'); d.style.setProperty('--c', it.color); b.appendChild(d); }
      b.appendChild(document.createTextNode(it.label));
      var n = S.loaded ? openIn(it.key).length : 0;
      if (n) b.appendChild(el('span', 'count', String(n)));
      nav.appendChild(b);
    });
    var add = el('button', 'chip chip-add', '+ Liste');
    add.type = 'button';
    add.dataset.action = 'new-list';
    nav.appendChild(add);
    nav.scrollLeft = sl;
  }

  function banner(text, label, fn) {
    var b = el('div', 'banner');
    b.appendChild(el('p', null, text));
    if (label) {
      var btn = el('button', null, label);
      btn.type = 'button';
      btn.addEventListener('click', fn);
      b.appendChild(btn);
    }
    $('banners').appendChild(b);
  }
  function renderBanners() {
    $('banners').textContent = '';
    if (!storageOK) {
      banner('Le stockage est bloqué sur ce navigateur (navigation privée ?) : tes tâches seront perdues à la fermeture.');
    }
    if (isIOS && !isStandalone && !lsGet(KEYS.hint)) {
      banner('Pour l’avoir comme une vraie app : touche Partager, puis « Sur l’écran d’accueil ».', 'OK', function () { lsSet(KEYS.hint, true); render(); });
    }
    if (S.loaded && allTasks().some(function (t) { return t.example; })) {
      banner('Les tâches marquées « exemple » te montrent comment ça marche.', 'Effacer les exemples', clearExamples);
    }
  }

  function renderList() {
    var main = $('list');
    openRow = null;
    main.textContent = '';
    if (!S.loaded) {
      for (var i = 0; i < 4; i++) main.appendChild(el('div', 'skel'));
      return;
    }
    var open = openIn(S.view), done = doneIn(S.view);
    if (!open.length) main.appendChild(emptyState(done.length > 0));
    groupsFor(S.view, open).forEach(function (g) {
      var sec = el('section', 'group');
      var h = el('h2', 'group-h' + (g.tone ? ' ' + g.tone : ''));
      h.appendChild(el('span', null, g.label));
      h.appendChild(el('span', 'n', String(g.items.length)));
      sec.appendChild(h);
      g.items.forEach(function (t) { sec.appendChild(taskRow(t)); });
      main.appendChild(sec);
    });
    if (done.length) {
      var sec = el('section', 'group');
      var head = el('div', 'done-h');
      var tg = el('button', 'done-toggle');
      tg.type = 'button';
      tg.dataset.action = 'toggle-done';
      tg.setAttribute('aria-expanded', String(S.doneOpen));
      tg.innerHTML = CHEVRON_SVG;
      tg.appendChild(document.createTextNode('Terminées · ' + done.length));
      var clr = el('button', 'link-btn', 'Effacer');
      clr.type = 'button';
      clr.dataset.action = 'clear-done';
      head.appendChild(tg);
      head.appendChild(clr);
      sec.appendChild(head);
      if (S.doneOpen) done.forEach(function (t) { sec.appendChild(taskRow(t)); });
      main.appendChild(sec);
    }
    if (S.view === 'all') {
      var foot = el('div', 'backup');
      foot.appendChild(el('p', null, 'Tes tâches sont gardées sur ce téléphone.'));
      var ex = el('button', null, 'Exporter une sauvegarde');
      ex.type = 'button';
      ex.dataset.action = 'export';
      var im = el('button', null, 'Restaurer');
      im.type = 'button';
      im.dataset.action = 'import';
      foot.appendChild(ex);
      foot.appendChild(im);
      main.appendChild(foot);
    }
  }

  function emptyState(hasDone) {
    var box = el('div', 'empty');
    box.innerHTML = EMPTY_SVG;
    var title, text;
    if (hasDone) { title = 'Tout est fait'; text = 'Bien joué. Les tâches cochées sont rangées plus bas.'; }
    else if (S.view === 'today') { title = 'Journée libre'; text = "Rien n'est prévu pour aujourd'hui. Ajoute une tâche avec le bouton en bas."; }
    else if (S.view === 'upcoming') { title = 'Rien de planifié'; text = 'Les tâches avec une date à venir apparaîtront ici.'; }
    else if (S.view === 'all') { title = 'Liste vide'; text = 'Appuie sur « Nouvelle tâche » pour commencer.'; }
    else { title = 'Liste vide'; text = 'Ajoute ta première tâche dans « ' + viewName(S.view) + ' ».'; }
    box.appendChild(el('strong', null, title));
    box.appendChild(el('p', null, text));
    return box;
  }

  function taskRow(t) {
    var wrap = el('div', 'task-wrap');
    wrap.dataset.id = t.id;
    var del = el('button', 'del-action', 'Supprimer');
    del.type = 'button';
    del.dataset.action = 'delete';
    del.tabIndex = -1;
    var row = el('div', 'task p' + t.priority + (t.done ? ' is-done' : ''));
    row.dataset.action = 'open';
    var chk = el('button', 'check');
    chk.type = 'button';
    chk.dataset.action = 'check';
    chk.setAttribute('aria-label', (t.done ? 'Remettre à faire : ' : 'Terminer : ') + t.title);
    chk.innerHTML = CHECK_SVG;
    var body = el('div', 'task-body');
    body.tabIndex = 0;
    body.setAttribute('role', 'button');
    body.setAttribute('aria-label', 'Modifier : ' + t.title);
    var line = el('div', 'task-line');
    if (t.priority) {
      var pm = el('span', 'prio-inline', PRIO[t.priority].marks);
      pm.setAttribute('aria-label', PRIO[t.priority].aria);
      line.appendChild(pm);
    }
    line.appendChild(el('span', 'task-title', t.title));
    body.appendChild(line);
    if (t.note) body.appendChild(el('p', 'task-note', t.note));
    var meta = el('div', 'task-meta');
    if (t.due) {
      var tone = (!t.done && t.due < S.today) ? ' overdue' : (t.due === S.today ? ' today' : '');
      var d = el('span', 'meta-due' + tone);
      d.innerHTML = CAL_SVG;
      d.appendChild(document.createTextNode(dueLabel(t.due)));
      meta.appendChild(d);
    }
    var list = listById(t.listId);
    if (list && S.view.indexOf('list:') !== 0) {
      var m = el('span', 'meta-list');
      var dot = el('i', 'dot');
      dot.style.setProperty('--c', list.color);
      m.appendChild(dot);
      m.appendChild(document.createTextNode(list.name));
      meta.appendChild(m);
    }
    if (t.example) meta.appendChild(el('span', 'tag-ex', 'exemple'));
    if (meta.childNodes.length) body.appendChild(meta);
    row.appendChild(chk);
    row.appendChild(body);
    wrap.appendChild(del);
    wrap.appendChild(row);
    return wrap;
  }

  /* ---------- actions ---------- */
  function setView(v) {
    S.view = v;
    S.doneOpen = false;
    lsSet(KEYS.view, v);
    render();
    window.scrollTo(0, 0);
    var active = $('chips').querySelector('[aria-pressed="true"]');
    if (active && active.scrollIntoView) active.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  }

  function toggleDone(id, rowEl) {
    var t = S.tasks.get(id);
    if (!t) return;
    var nowDone = !t.done;
    function apply() {
      var cur = S.tasks.get(id);
      if (!cur) return;
      writeTask(Object.assign({}, cur, { done: nowDone, doneAt: nowDone ? Date.now() : null }));
      changed();
      if (nowDone) toast('Tâche terminée', { label: 'Annuler', fn: function () {
        var c = S.tasks.get(id);
        if (c) { writeTask(Object.assign({}, c, { done: false, doneAt: null })); changed(); }
      } });
    }
    if (nowDone && rowEl && !reduceMotion) { rowEl.classList.add('completing'); setTimeout(apply, 450); }
    else apply();
  }

  function deleteTask(id) {
    var t = S.tasks.get(id);
    if (!t) return;
    dropTask(id);
    changed();
    toast('Tâche supprimée', { label: 'Annuler', fn: function () { writeTask(t); changed(); } });
  }

  function removeMany(list, msg) {
    if (!list.length) return;
    list.forEach(function (t) { dropTask(t.id); });
    changed();
    toast(msg, { label: 'Annuler', fn: function () { list.forEach(writeTask); changed(); } });
  }
  function clearDone() {
    var d = doneIn(S.view);
    removeMany(d, plural(d.length, 'tâche effacée', 'tâches effacées'));
  }
  function clearExamples() {
    removeMany(allTasks().filter(function (t) { return t.example; }), 'Exemples effacés');
  }
  function exportBackup() {
    var data = JSON.stringify({ app: 'pense-bete', version: 1, exportedAt: new Date().toISOString(), lists: S.lists, tasks: allTasks() }, null, 2);
    var name = 'pense-bete-' + S.today + '.json';
    var file = null;
    try { file = new File([data], name, { type: 'application/json' }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Sauvegarde Pense-bête' }).catch(function () {});
      return;
    }
    var url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function importBackup(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(String(r.result));
        var lists = cleanLists(d && d.lists);
        if (!lists || !Array.isArray(d.tasks)) throw new Error('format');
        var before = { tasks: allTasks(), lists: S.lists.slice() };
        var m = new Map();
        d.tasks.forEach(function (raw) { var t = cleanTask(raw && raw.id, raw); if (t) m.set(t.id, t); });
        S.tasks = m;
        S.lists = lists;
        changed();
        toast(plural(m.size, 'tâche restaurée', 'tâches restaurées'), { label: 'Annuler', fn: function () {
          S.tasks = new Map(before.tasks.map(function (t) { return [t.id, t]; }));
          S.lists = before.lists;
          changed();
        } });
      } catch (e) {
        toast('Ce fichier n’est pas une sauvegarde Pense-bête.');
      }
    };
    r.onerror = function () { toast('Lecture du fichier impossible.'); };
    r.readAsText(file);
  }

  /* ---------- swipe to delete ---------- */
  var drag = null, openRow = null, suppressUntil = 0;
  function openSwipe(row) {
    if (openRow && openRow !== row) closeSwipe(openRow);
    row.parentNode.classList.add('swiping');
    row.style.transform = 'translateX(-104px)';
    openRow = row;
  }
  function closeSwipe(row) {
    row.style.transform = '';
    if (openRow === row) openRow = null;
    setTimeout(function () { if (openRow !== row && row.parentNode) row.parentNode.classList.remove('swiping'); }, 240);
  }

  /* ---------- sheets ---------- */
  var activeSheet = null;
  function showSheet(sh) {
    if (openRow) closeSwipe(openRow);
    activeSheet = sh;
    var bd = $('backdrop');
    bd.hidden = false;
    sh.hidden = false;
    void sh.offsetHeight;
    bd.classList.add('open');
    sh.classList.add('open');
    document.documentElement.classList.add('locked');
  }
  function closeSheet() {
    var sh = activeSheet;
    if (!sh) return;
    activeSheet = null;
    var bd = $('backdrop');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    sh.classList.remove('open');
    bd.classList.remove('open');
    document.documentElement.classList.remove('locked');
    setTimeout(function () {
      if (activeSheet !== sh) sh.hidden = true;
      if (!activeSheet) bd.hidden = true;
    }, reduceMotion ? 0 : 320);
  }

  var F = { id: null, due: null, priority: 0, listId: null, confirm: false };
  function openTaskSheet(id) {
    var t = id ? S.tasks.get(id) : null;
    F.id = t ? t.id : null;
    F.due = t ? t.due : (S.view === 'today' ? S.today : (S.view === 'upcoming' ? iso(addDays(parseISO(S.today), 1)) : null));
    F.priority = t ? t.priority : 0;
    F.listId = t ? (listById(t.listId) ? t.listId : null) : (S.view.indexOf('list:') === 0 ? S.view.slice(5) : (S.lists[0] ? S.lists[0].id : null));
    F.confirm = false;
    $('fTitle').value = t ? t.title : '';
    $('fNote').value = t ? t.note : '';
    $('tsTitle').textContent = t ? 'Modifier' : 'Nouvelle tâche';
    $('tsSubmit').textContent = t ? 'OK' : 'Ajouter';
    var del = $('tsDelete');
    del.hidden = !t;
    del.classList.remove('confirm');
    del.textContent = 'Supprimer la tâche';
    renderTaskOpts();
    showSheet($('taskSheet'));
    $('taskSheet').querySelector('.sheet-body').scrollTop = 0;
    if (!t) { try { $('fTitle').focus({ preventScroll: true }); } catch (e) { $('fTitle').focus(); } }
  }
  function renderTaskOpts() {
    var dueBox = $('dueOpts');
    dueBox.textContent = '';
    quickDates().forEach(function (q) {
      var b = el('button', 'opt', q.label);
      b.type = 'button';
      b.dataset.due = q.value || '';
      b.setAttribute('aria-pressed', String((F.due || null) === (q.value || null)));
      dueBox.appendChild(b);
    });
    $('fDue').value = F.due || '';
    $('dateRow').classList.toggle('has-value', !!F.due);

    var pBox = $('prioOpts');
    pBox.textContent = '';
    PRIO.forEach(function (p) {
      var b = el('button', 'seg-btn p' + p.v);
      b.type = 'button';
      b.dataset.prio = String(p.v);
      b.setAttribute('aria-pressed', String(F.priority === p.v));
      b.appendChild(el('b', null, p.marks || '–'));
      b.appendChild(document.createTextNode(p.label));
      pBox.appendChild(b);
    });

    var lBox = $('listOpts');
    lBox.textContent = '';
    S.lists.forEach(function (l) {
      var b = el('button', 'opt');
      b.type = 'button';
      b.dataset.list = l.id;
      b.setAttribute('aria-pressed', String(F.listId === l.id));
      var d = el('i', 'dot');
      d.style.setProperty('--c', l.color);
      b.appendChild(d);
      b.appendChild(document.createTextNode(l.name));
      lBox.appendChild(b);
    });
    if (!S.lists.length) lBox.appendChild(el('p', 'hint', 'Aucune liste pour l’instant.'));
  }

  var L = { id: null, color: LIST_COLORS[0], confirm: false };
  function openListSheet(id) {
    var l = id ? listById(id) : null;
    L.id = l ? l.id : null;
    L.confirm = false;
    if (l) L.color = l.color;
    else {
      var used = S.lists.map(function (x) { return x.color; });
      L.color = LIST_COLORS.filter(function (c) { return used.indexOf(c) < 0; })[0] || LIST_COLORS[S.lists.length % LIST_COLORS.length];
    }
    $('lName').value = l ? l.name : '';
    $('lsTitle').textContent = l ? 'Modifier la liste' : 'Nouvelle liste';
    $('lsSubmit').textContent = l ? 'OK' : 'Créer';
    var del = $('lsDelete');
    del.hidden = !l;
    del.classList.remove('confirm');
    del.textContent = 'Supprimer la liste';
    renderSwatches();
    showSheet($('listSheet'));
    if (!l) { try { $('lName').focus({ preventScroll: true }); } catch (e) { $('lName').focus(); } }
  }
  function renderSwatches() {
    var box = $('swatches');
    box.textContent = '';
    LIST_COLORS.forEach(function (c) {
      var b = el('button', 'swatch');
      b.type = 'button';
      b.dataset.color = c;
      b.style.setProperty('--c', c);
      b.setAttribute('aria-pressed', String(L.color === c));
      b.setAttribute('aria-label', 'Couleur ' + c);
      box.appendChild(b);
    });
  }
  function shake(node) {
    node.classList.remove('shake');
    void node.offsetWidth;
    node.classList.add('shake');
    try { node.focus({ preventScroll: true }); } catch (e) { node.focus(); }
  }

  /* ---------- toast ---------- */
  var toastTimer = null, toastFn = null;
  function toast(text, action) {
    var t = $('toast'), b = $('toastAction');
    $('toastText').textContent = text;
    if (action) { b.hidden = false; b.textContent = action.label; toastFn = action.fn; }
    else { b.hidden = true; toastFn = null; }
    t.hidden = false;
    void t.offsetHeight;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, action ? 5000 : 2400);
  }
  function hideToast() {
    var t = $('toast');
    t.classList.remove('show');
    toastFn = null;
    setTimeout(function () { if (!t.classList.contains('show')) t.hidden = true; }, 260);
  }

  /* ---------- events ---------- */
  function bind() {
    $('chips').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.action === 'new-list') openListSheet(null);
      else if (b.dataset.view) setView(b.dataset.view);
    });
    $('viewMenu').addEventListener('click', function () { if (S.view.indexOf('list:') === 0) openListSheet(S.view.slice(5)); });
    $('addBtn').addEventListener('click', function () { openTaskSheet(null); });
    $('backdrop').addEventListener('click', closeSheet);
    document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closeSheet); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
    $('toastAction').addEventListener('click', function () { var fn = toastFn; hideToast(); if (fn) fn(); });

    var main = $('list');
    main.addEventListener('click', function (e) {
      if (performance.now() < suppressUntil) return;
      var a = e.target.closest('[data-action]');
      if (!a) return;
      var wrap = a.closest('.task-wrap');
      var id = wrap && wrap.dataset.id;
      var act = a.dataset.action;
      if (openRow && act !== 'delete') { closeSwipe(openRow); if (act === 'open') return; }
      if (act === 'check') toggleDone(id, wrap.querySelector('.task'));
      else if (act === 'open') openTaskSheet(id);
      else if (act === 'delete') deleteTask(id);
      else if (act === 'toggle-done') { S.doneOpen = !S.doneOpen; renderList(); }
      else if (act === 'clear-done') clearDone();
      else if (act === 'export') exportBackup();
      else if (act === 'import') $('importFile').click();
    });
    main.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('task-body')) {
        e.preventDefault();
        var wrap = e.target.closest('.task-wrap');
        if (wrap) openTaskSheet(wrap.dataset.id);
      }
    });

    main.addEventListener('pointerdown', function (e) {
      if (openRow && !openRow.parentNode.contains(e.target)) closeSwipe(openRow);
      var row = e.target.closest('.task');
      if (!row || e.target.closest('.check') || e.button > 0) return;
      drag = { row: row, x: e.clientX, y: e.clientY, base: row === openRow ? -104 : 0, dx: 0, active: false, pid: e.pointerId };
    });
    main.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.pid) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.active) {
        if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) {
          drag.active = true;
          drag.row.classList.add('dragging');
          drag.row.parentNode.classList.add('swiping');
          try { drag.row.setPointerCapture(e.pointerId); } catch (err) {}
        } else if (Math.abs(dy) > 10) { drag = null; return; }
        else return;
      }
      var x = Math.min(0, Math.max(-160, drag.base + dx));
      drag.dx = x;
      drag.row.style.transform = 'translateX(' + x + 'px)';
    });
    function endDrag() {
      if (!drag) return;
      var d = drag;
      drag = null;
      if (!d.active) return;
      d.row.classList.remove('dragging');
      suppressUntil = performance.now() + 350;
      if (d.dx < -64) openSwipe(d.row); else closeSwipe(d.row);
    }
    main.addEventListener('pointerup', endDrag);
    main.addEventListener('pointercancel', endDrag);

    /* task sheet */
    $('dueOpts').addEventListener('click', function (e) {
      var b = e.target.closest('[data-due]');
      if (!b) return;
      F.due = b.dataset.due || null;
      renderTaskOpts();
    });
    function onDate() { F.due = $('fDue').value || null; renderTaskOpts(); }
    $('fDue').addEventListener('change', onDate);
    $('fDue').addEventListener('input', onDate);
    $('prioOpts').addEventListener('click', function (e) {
      var b = e.target.closest('[data-prio]');
      if (!b) return;
      F.priority = Number(b.dataset.prio);
      renderTaskOpts();
    });
    $('listOpts').addEventListener('click', function (e) {
      var b = e.target.closest('[data-list]');
      if (!b) return;
      F.listId = F.listId === b.dataset.list ? null : b.dataset.list;
      renderTaskOpts();
    });
    $('taskSheet').addEventListener('submit', function (e) {
      e.preventDefault();
      var title = $('fTitle').value.trim();
      if (!title) { shake($('fTitle')); return; }
      var base = F.id ? S.tasks.get(F.id) : null;
      var t = base ? Object.assign({}, base) : { id: newId('t_'), done: false, doneAt: null, createdAt: Date.now() };
      t.title = title;
      t.note = $('fNote').value.trim();
      t.due = F.due;
      t.priority = F.priority;
      t.listId = F.listId;
      t.example = false;
      writeTask(t);
      closeSheet();
      changed();
      if (!base) {
        if (inView(t, S.view)) toast('Tâche ajoutée');
        else {
          var target = t.listId ? 'list:' + t.listId : 'all';
          toast('Ajoutée dans « ' + viewName(target) + ' »', { label: 'Voir', fn: function () { setView(target); } });
        }
      }
    });
    $('tsDelete').addEventListener('click', function () {
      var b = $('tsDelete');
      if (!F.confirm) { F.confirm = true; b.classList.add('confirm'); b.textContent = 'Toucher encore pour supprimer'; return; }
      var id = F.id;
      closeSheet();
      deleteTask(id);
    });

    /* list sheet */
    $('swatches').addEventListener('click', function (e) {
      var b = e.target.closest('[data-color]');
      if (!b) return;
      L.color = b.dataset.color;
      renderSwatches();
    });
    $('listSheet').addEventListener('submit', function (e) {
      e.preventDefault();
      var name = $('lName').value.trim();
      if (!name) { shake($('lName')); return; }
      var target;
      if (L.id) {
        S.lists = S.lists.map(function (l) { return l.id === L.id ? { id: l.id, name: name, color: L.color } : l; });
        target = 'list:' + L.id;
      } else {
        var nl = { id: newId('l_'), name: name, color: L.color };
        S.lists = S.lists.concat([nl]);
        target = 'list:' + nl.id;
      }
      saveLists();
      closeSheet();
      S.listsReady = true;
      setView(target);
      if (S.mode === 'local') saveLocal();
    });
    $('lsDelete').addEventListener('click', function () {
      var b = $('lsDelete');
      var inList = allTasks().filter(function (t) { return t.listId === L.id; });
      if (!L.confirm) {
        L.confirm = true;
        b.classList.add('confirm');
        b.textContent = inList.length ? 'Supprimer la liste et ' + plural(inList.length, 'tâche', 'tâches') + ' ?' : 'Toucher encore pour supprimer';
        return;
      }
      var gone = listById(L.id), before = S.lists.slice();
      inList.forEach(function (t) { dropTask(t.id); });
      S.lists = S.lists.filter(function (l) { return l.id !== L.id; });
      saveLists();
      closeSheet();
      S.view = 'all';
      lsSet(KEYS.view, 'all');
      changed();
      toast('Liste « ' + (gone ? gone.name : '') + ' » supprimée', { label: 'Annuler', fn: function () {
        S.lists = before;
        saveLists();
        inList.forEach(writeTask);
        changed();
      } });
    });

    $('importFile').addEventListener('change', function () {
      var f = this.files && this.files[0];
      if (f) importBackup(f);
      this.value = '';
    });

    setInterval(checkDay, 30000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) checkDay(); });
  }
  function checkDay() {
    var t = todayISO();
    if (t !== S.today) { S.today = t; render(); }
  }

  /* ---------- storage ---------- */
  function exampleTasks() {
    var now = parseISO(S.today), t0 = Date.now();
    function d(n) { return iso(addDays(now, n)); }
    function T(id, title, o) {
      return Object.assign({ id: id, title: title, note: '', listId: 'perso', due: null, priority: 0, done: false, doneAt: null, createdAt: t0, example: true }, o);
    }
    return [
      T('ex_1', 'Envoyer le compte rendu de réunion', { listId: 'travail', due: d(-1), priority: 3 }),
      T('ex_2', 'Appeler le dentiste pour un rendez-vous', { due: d(0), priority: 2, note: 'Glisse une tâche vers la gauche pour la supprimer.' }),
      T('ex_3', 'Arroser les plantes', { due: d(0) }),
      T('ex_4', 'Préparer la présentation de jeudi', { listId: 'travail', due: d(2), priority: 1 }),
      T('ex_5', 'Lait, œufs, pain', { listId: 'courses' }),
      T('ex_6', 'Réserver le restaurant', { due: d(0), done: true, doneAt: t0 })
    ];
  }
  function startLocal() {
    S.mode = 'local';
    var loc = lsGet(KEYS.local);
    if (!loc) loc = { tasks: exampleTasks(), lists: DEFAULT_LISTS.slice() };
    var m = new Map();
    if (Array.isArray(loc.tasks)) loc.tasks.forEach(function (raw) { var t = cleanTask(raw && raw.id, raw); if (t) m.set(t.id, t); });
    S.tasks = m;
    S.lists = cleanLists(loc.lists) || DEFAULT_LISTS.slice();
    S.loaded = true;
    S.listsReady = true;
    saveLocal();
    render();
  }

  /* ---------- boot ---------- */
  var v = lsGet(KEYS.view);
  if (typeof v === 'string') S.view = v;
  bind();
  startLocal();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
